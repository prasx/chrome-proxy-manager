<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=420" />
<title>Proxy Manager</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="popup-body">

<header class="header">
  <div class="header-left">
    <div class="logo-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
    </div>
    <span class="logo-name">Proxy Manager</span>
  </div>
  <div class="header-actions">
    <div class="header-modes" role="group" aria-label="Режим работы прокси">
      <button class="header-mode" type="button" data-mode="auto" aria-pressed="false" title="Авто: недоступные сайты добавляются в прокси">Авто</button>
      <button class="header-mode" type="button" data-mode="manual" aria-pressed="false" title="Ручной: через прокси идут только сайты из ваших правил">Ручной</button>
    </div>
    <button class="header-btn" id="dashboardBtn" type="button" title="Панель управления" aria-label="Открыть панель управления">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
</header>

<main class="popup-main">

  <section class="power-card" id="powerCard" data-state="checking" aria-live="polite">
    <div class="power-head">
      <div class="power-copy">
        <h1 class="power-title" id="stateTitle">Проверяем прокси…</h1>
        <p class="power-detail" id="stateDetail">Это займёт пару секунд</p>
      </div>
      <button class="power-switch" id="toggleBtn" type="button" role="switch" aria-checked="true" aria-label="Прокси включён">
        <span class="power-switch__knob" aria-hidden="true"></span>
      </button>
    </div>

    <dl class="power-grid">
      <div class="power-grid__item">
        <dt>Прокси</dt>
        <dd id="proxyName">—</dd>
      </div>
      <div class="power-grid__item">
        <dt>Внешний IP</dt>
        <dd id="proxyIp">—</dd>
      </div>
      <div class="power-grid__item">
        <dt>Отклик</dt>
        <dd id="latency">—</dd>
      </div>
    </dl>

    <div class="power-foot">
      <span class="power-checked" id="checkedAt"></span>
      <button class="link-btn" id="refreshBtn" type="button">Проверить ещё раз</button>
    </div>
  </section>

  <div class="issue-banner" id="issueBanner" hidden aria-live="polite">
    <span class="issue-banner__mark" aria-hidden="true">!</span>
    <div class="issue-banner__copy">
      <div class="issue-banner__title" id="issueTitle">Ошибка прокси</div>
      <div class="issue-banner__text" id="issueText"></div>
    </div>
    <div class="issue-banner__actions">
      <button class="link-btn" id="issueLogsBtn" type="button">Логи</button>
      <button class="issue-banner__dismiss" id="issueDismissBtn" type="button" title="Скрыть сообщение" aria-label="Скрыть сообщение">×</button>
    </div>
  </div>

  <section class="page-rules" aria-labelledby="pageRulesTitle">
    <div class="page-rules__head">
      <div class="page-rules__copy">
        <h2 class="section-label" id="pageRulesTitle">Домены страницы</h2>
        <p class="page-rules__summary" id="pageRulesSummary">Собираем домены…</p>
      </div>
      <button class="link-btn" id="refreshDomainsBtn" type="button" title="Список обновляется автоматически. Нажмите, чтобы обновить сейчас">Обновить</button>
    </div>

    <div class="page-rules__panel">
      <div class="page-rules__list" id="pageRulesList"></div>
      <div class="page-rules__actions" id="pageRulesActions" hidden>
        <button class="btn btn-primary" id="applyDomainsBtn" type="button" disabled>Применить</button>
        <button class="btn btn-secondary" id="resetDomainsBtn" type="button" title="Вернуть выбранные маршруты к текущим правилам">Отменить</button>
      </div>
    </div>
  </section>

  <div class="rules-status">
    <span class="rules-status__text" id="rulesStatusText">Правил пока нет</span>
    <button class="link-btn" id="manageRulesBtn" type="button">Все правила</button>
  </div>

</main>

<script src="shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
